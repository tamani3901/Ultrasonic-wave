<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>超音波データ通信 (修正版)</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; height: 50px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 16px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-right: 5px; }
    button:disabled { background: #ccc; }
    .btn-send { background: #28a745; }
    .btn-listen { background: #007bff; }
    .btn-cancel { background: #dc3545; }
    select { padding: 8px; font-size: 14px; margin-bottom: 10px; }
    .result { font-size: 22px; font-weight: bold; color: #007bff; padding: 10px; background: #e8f4ff; border-radius: 6px; text-align: center; margin-top: 10px; }
    .log { font-family: monospace; font-size: 11px; background: #eee; padding: 8px; height: 140px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>🦇 超音波通信 (修正版)</h2>

  <div class="card">
    <h3>1. 送信設定</h3>
    <label>送信モード: </label>
    <select id="txSpeed">
      <option value="100">🛡️ 正確モード (100ms)</option>
      <option value="60">⚡ 高速モード (60ms)</option>
    </select>
    <textarea id="inputText" placeholder="送信文字">テスト</textarea>
    <button class="btn-send" id="btnSend">🔊 超音波送信</button>
  </div>

  <div class="card">
    <h3>2. 受信設定</h3>
    <label>受信モード: </label>
    <select id="rxSpeed">
      <option value="100">🛡️ 正確モード (100ms)</option>
      <option value="60">⚡ 高速モード (60ms)</option>
    </select>
    <div>
      <button class="btn-listen" id="btnListen">🎤 マイク受信開始</button>
      <button class="btn-cancel" id="btnCancel" disabled>⏹️ キャンセル</button>
    </div>
    <div id="status" style="margin-top:10px; font-weight:bold; color:#d9534f;">待機中</div>
    <div id="outputText" class="result">---</div>
    <div id="log" class="log">ログがここに表示されます</div>
  </div>

<script>
const FREQ_0  = 18500;
const FREQ_1  = 19000;
const FREQ_ST = 19500;

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function encodeHamming(d4) {
  const d = [(d4>>3)&1, (d4>>2)&1, (d4>>1)&1, d4&1];
  return (d[0]<<6)|(d[1]<<5)|(d[2]<<4)|(d[3]<<3)|((d[0]^d[1]^d[3])<<2)|((d[0]^d[2]^d[3])<<1)|(d[1]^d[2]^d[3]);
}
function decodeHamming(c7) {
  const b = [];
  for (let i = 6; i >= 0; i--) b.push((c7 >> i) & 1);
  const s1 = b[0] ^ b[1] ^ b[3] ^ b[4];
  const s2 = b[0] ^ b[2] ^ b[3] ^ b[5];
  const s3 = b[1] ^ b[2] ^ b[3] ^ b[6];
  const err = (s1 << 2) | (s2 << 1) | s3;
  if (err >= 1 && err <= 7) b[err - 1] ^= 1;
  return (b[0]<<3) | (b[1]<<2) | (b[2]<<1) | b[3];
}
function byteTo14Bits(val) {
  const h = encodeHamming((val >> 4) & 0x0F);
  const l = encodeHamming(val & 0x0F);
  let bits = [];
  for (let i = 6; i >= 0; i--) bits.push((h >> i) & 1);
  for (let i = 6; i >= 0; i--) bits.push((l >> i) & 1);
  return bits;
}

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += "\n" + msg;
  el.scrollTop = el.scrollHeight;
}

// --- 送信処理 ---
document.getElementById('btnSend').onclick = () => {
  const ctx = getCtx();
  const text = document.getElementById('inputText').value;
  const tBit = parseInt(document.getElementById('txSpeed').value) / 1000;
  if (!text) return;

  const bytes = new TextEncoder().encode(text);
  let rawBits = [];
  
  // ヘッダー3重化
  byteTo14Bits(bytes.length & 0x7F).forEach(b => { rawBits.push(b); rawBits.push(b); rawBits.push(b); });
  // データ
  bytes.forEach(b => byteTo14Bits(b).forEach(bit => rawBits.push(bit)));

  const now = ctx.currentTime + 0.05;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  // パイロット音 (300ms)
  osc.frequency.setValueAtTime(FREQ_ST, now);
  gain.gain.setValueAtTime(0.2, now);

  let t = now + 0.3;
  rawBits.forEach((bit) => {
    osc.frequency.setValueAtTime(bit === 1 ? FREQ_1 : FREQ_0, t);
    t += tBit;
  });

  gain.gain.setValueAtTime(0, t);
  osc.start(now);
  osc.stop(t);
  log(`送信開始: ${rawBits.length} bits (${tBit*1000}ms/bit)`);
};

// --- 受信処理 ---
let rxTimer = null;
let mediaStream = null;

function stopRx() {
  if (rxTimer) { clearInterval(rxTimer); rxTimer = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  document.getElementById('btnListen').disabled = false;
  document.getElementById('btnCancel').disabled = true;
  document.getElementById('status').textContent = '⏹️ 受信停止';
}
document.getElementById('btnCancel').onclick = stopRx;

document.getElementById('btnListen').onclick = async () => {
  const tBitMs = parseInt(document.getElementById('rxSpeed').value);
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch(e) {
    log('マイク拒否: ' + e.message);
    return;
  }

  document.getElementById('btnListen').disabled = true;
  document.getElementById('btnCancel').disabled = false;
  document.getElementById('status').textContent = '🎤 受信待機中...';

  const ctx = getCtx();
  const source = ctx.createMediaStreamSource(mediaStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  const binSize = ctx.sampleRate / analyser.fftSize;
  const b0  = Math.round(FREQ_0 / binSize);
  const b1  = Math.round(FREQ_1 / binSize);
  const bST = Math.round(FREQ_ST / binSize);

  const data = new Uint8Array(analyser.frequencyBinCount);
  let state = 'idle';
  let bitStream = [];

  rxTimer = setInterval(() => {
    analyser.getByteFrequencyData(data);
    const p0 = data[b0], p1 = data[b1], pST = data[bST];

    if (state === 'idle') {
      if (pST > 30) {
        state = 'rx';
        bitStream = [];
        log('超音波パイロット信号を検出');
      }
    } else if (state === 'rx') {
      bitStream.push(p1 > p0 ? 1 : 0);
      document.getElementById('status').textContent = `受信中: ${bitStream.length} bits`;

      // ヘッダー判定 (14×3 = 42ビット到達時)
      if (bitStream.length >= 42) {
        let hBits = [];
        for(let i=0; i<42; i+=3) {
          hBits.push((bitStream[i]+bitStream[i+1]+bitStream[i+2])>=2 ? 1 : 0);
        }
        const dataLen = decodeByte14(hBits);
        const total = 42 + (dataLen * 14);

        if (dataLen > 0 && bitStream.length >= total) {
          let bytes = [];
          for(let i=42; i<total; i+=14) {
            bytes.push(decodeByte14(bitStream.slice(i, i+14)));
          }
          const text = new TextDecoder().decode(new Uint8Array(bytes));
          document.getElementById('outputText').textContent = text;
          log('✅ 受信成功: ' + text);
          stopRx();
        }
      }
    }
  }, tBitMs);
};

function decodeByte14(bits14) {
  if (bits14.length < 14) return 0;
  const h = bits14.slice(0, 7).reduce((acc, b) => (acc << 1) | b, 0);
  const l = bits14.slice(7, 14).reduce((acc, b) => (acc << 1) | b, 0);
  return (decodeHamming(h) << 4) | decodeHamming(l);
}
</script>
</body>
</html>
